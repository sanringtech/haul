name: release-windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --base-href ./

      - name: Stage wwwroot
        shell: pwsh
        run: |
          if (Test-Path backend/wwwroot) { Remove-Item -Recurse -Force backend/wwwroot }
          New-Item -ItemType Directory -Path backend/wwwroot | Out-Null
          Copy-Item -Recurse frontend/dist/frontend/browser backend/wwwroot/browser

      - name: Publish win-x64
        run: >
          dotnet publish backend
          -c Release
          -r win-x64
          --self-contained true
          -o publish/win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notlike 'v*') { $tag = "v$ver" }
          $asset = "publish/win-x64/SanringHaul-$ver-Windows-x64.exe"
          Move-Item -Force publish/win-x64/SanringHaul.exe $asset
          $notes = "docs/release-notes-v$ver.md"
          if (-not (Test-Path $notes)) { $notes = "CHANGELOG.md" }
          $view = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $view) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title "v$ver" --notes-file $notes
          }
